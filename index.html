<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CYBER GACHA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 背景 -->
    <div class="grid"></div>
    <div class="scanlines"></div>


    <!-- ヘッダー -->
    <header>

        <div class="status">
            ● SYSTEM ONLINE
        </div>

        <h1>
            CYBER GACHA
        </h1>

        <p>
            TAP THE BOX TO OPEN
        </p>

    </header>


    <main>

        <!-- ガチャエリア -->
        <div id="gachaArea">

            <div class="scanner scanner1"></div>
            <div class="scanner scanner2"></div>


            <!-- ガチャボックス -->
            <div id="gachaBox">

                <div class="boxTop">

                    <div class="boxLight"></div>

                </div>


                <div class="boxBody">

                    <div class="boxScreen">

                        <span>
                            CYBER
                        </span>

                        <strong>
                            GACHA
                        </strong>

                    </div>


                    <div class="boxCore"></div>


                    <div class="boxLine line1"></div>
                    <div class="boxLine line2"></div>
                    <div class="boxLine line3"></div>

                </div>


                <div class="boxBottom"></div>

            </div>


            <div id="tapText">
                TAP BOX
            </div>

        </div>


        <!-- 結果 -->
        <div id="resultArea">

            <div id="resultLabel">
                RESULT
            </div>

            <div id="resultRarity">
                ---
            </div>

        </div>


        <!-- 履歴 -->
        <div id="historyArea">

            <h2>
                HISTORY
            </h2>

            <div id="historyList"></div>

        </div>

    </main>


    <!-- SSR演出 -->
    <div id="ssrOverlay" class="overlay">

        <div class="overlayContent">

            <div class="rareText">
                SUPER RARE
            </div>

            <div class="rareRarity">
                SSR
            </div>

            <button id="ssrContinue">
                CONTINUE
            </button>

        </div>

    </div>


    <!-- XR演出 -->
    <div id="xrOverlay" class="overlay xr">

        <div class="overlayContent">

            <div class="rareText">
                EXTREME RARE
            </div>

            <div class="rareRarity">
                XR
            </div>

            <button id="xrContinue">
                CONTINUE
            </button>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
