<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CYBER GACHA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =================================
         HEADER
    ================================== -->

    <header>

        <div class="systemStatus">
            <span class="statusDot"></span>
            SYSTEM ONLINE
        </div>

        <h1>
            # CYBER GACHA
        </h1>

    </header>


    <!-- =================================
         MAIN
    ================================== -->

    <main>

        <div class="instruction">
            TAP THE BOX TO OPEN
        </div>


        <!-- =================================
             GACHA AREA
        ================================== -->

        <section id="gachaArea">

            <!-- パーティクル -->
            <div id="particleContainer"></div>

            <!-- クリスタル -->
            <div id="crystalContainer"></div>

            <!-- ビーム -->
            <div id="beamContainer"></div>

            <!-- 衝撃波 -->
            <div id="shockwaveContainer"></div>


            <!-- =================================
                 GACHA BOX
            ================================== -->

            <div id="gachaBox">

                <div class="boxOuter">

                    <div class="boxGlow"></div>

                    <div class="boxTop"></div>

                    <div class="boxMain">

                        <div class="boxScreen">

                            <div id="boxScreenSmall">
                                CYBER
                            </div>

                            <div id="boxScreenMain">
                                GACHA
                            </div>

                        </div>

                        <div class="boxCore"></div>

                    </div>

                    <div class="boxBottom"></div>

                </div>

            </div>


            <!-- =================================
                 CHARGE MESSAGE
            ================================== -->

            <div id="chargeMessage">
                GACHA
            </div>

        </section>


        <!-- =================================
             RESULT
        ================================== -->

        <section id="resultSection">

            <div class="sectionTitle">
                RESULT
            </div>

            <div id="resultRarity">
                ---
            </div>

        </section>


        <!-- =================================
             GUARANTEE
        ================================== -->

        <section id="guaranteeSection">

            <div class="guaranteeCard">

                <div class="guaranteeTitle">
                    SSR GUARANTEE
                </div>

                <div id="ssrCounter">
                    0 / 200
                </div>

                <div class="progressBackground">
                    <div id="ssrBar"></div>
                </div>

            </div>


            <div class="guaranteeCard">

                <div class="guaranteeTitle">
                    XR GUARANTEE
                </div>

                <div id="xrCounter">
                    0 / 15000
                </div>

                <div class="progressBackground">
                    <div id="xrBar"></div>
                </div>

            </div>

        </section>


        <!-- =================================
             SETTINGS
        ================================== -->

        <section id="settings">

            <button id="ldmButton">
                LDM: OFF
            </button>

            <button id="skipButton">
                SKIP: OFF
            </button>

            <!-- データリセット -->
            <button id="resetButton">
                RESET DATA
            </button>

        </section>


        <!-- =================================
             HISTORY
        ================================== -->

        <section id="historySection">

            <div class="sectionTitle">
                HISTORY
            </div>

            <div id="historyList"></div>

        </section>

    </main>


    <!-- =================================
         SSR OVERLAY
    ================================== -->

    <div id="ssrOverlay">

        <div class="overlayContent">

            <div class="overlayLabel">
                SUPER RARE
            </div>

            <div class="overlayRarity">
                SSR
            </div>

            <button id="ssrContinue">
                CONTINUE
            </button>

        </div>

    </div>


    <!-- =================================
         XR OVERLAY
    ================================== -->

    <div id="xrOverlay">

        <div class="overlayContent">

            <div class="overlayLabel">
                EXTREME RARE
            </div>

            <div class="overlayRarity">
                XR
            </div>

            <button id="xrContinue">
                CONTINUE
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
