<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CYBER GACHA</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         BACKGROUND
    ========================== -->

    <div class="grid"></div>

    <div class="scanlines"></div>


    <!-- =========================
         LDM BUTTON
    ========================== -->

    <button id="ldmButton">
        LDM: OFF
    </button>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="status">
            ● SYSTEM ONLINE
        </div>

        <h1>
            CYBER GACHA
        </h1>

        <p>
            TAP THE BOX TO OPEN
        </p>

    </header>


    <main>


        <!-- =========================
             GACHA AREA
        ========================== -->

        <div id="gachaArea">


            <!-- =====================
                 SCANNERS
            ====================== -->

            <div
                class="scanner scanner1"
            ></div>

            <div
                class="scanner scanner2"
            ></div>


            <!-- =====================
                 HUD RINGS
            ====================== -->

            <div
                class="hudRing hudRing1"
            ></div>

            <div
                class="hudRing hudRing2"
            ></div>

            <div
                class="hudRing hudRing3"
            ></div>


            <!-- =====================
                 CRYSTALS
            ====================== -->

            <div
                id="crystalContainer"
            ></div>


            <!-- =====================
                 GACHA BOX
            ====================== -->

            <div
                id="gachaBox"
            >


                <!-- BOX TOP -->

                <div class="boxTop">

                    <div class="boxLight"></div>

                </div>


                <!-- BOX BODY -->

                <div class="boxBody">


                    <!-- SCREEN -->

                    <div class="boxScreen">

                        <span id="boxScreenSmall">
                            CYBER
                        </span>

                        <strong id="boxScreenMain">
                            GACHA
                        </strong>

                    </div>


                    <!-- CORE -->

                    <div
                        class="boxCore"
                    ></div>


                    <!-- LINES -->

                    <div
                        class="boxLine line1"
                    ></div>

                    <div
                        class="boxLine line2"
                    ></div>

                    <div
                        class="boxLine line3"
                    ></div>


                </div>


                <!-- BOX BOTTOM -->

                <div class="boxBottom"></div>


            </div>


            <!-- =====================
                 TAP TEXT
            ====================== -->

            <div id="tapText">
                TAP BOX
            </div>


            <!-- =====================
                 CHARGE MESSAGE
            ====================== -->

            <div id="chargeMessage">
                SYSTEM READY
            </div>


        </div>



        <!-- =========================
             GUARANTEE COUNTERS
        ========================== -->

        <div id="guaranteeArea">


            <!-- SSR -->

            <div class="guaranteeCard">

                <div class="guaranteeTitle">
                    SSR GUARANTEE
                </div>

                <div
                    id="ssrCounter"
                    class="guaranteeCounter"
                >
                    0 / 200
                </div>

                <div class="guaranteeBar">

                    <div
                        id="ssrBar"
                        class="guaranteeBarFill"
                    ></div>

                </div>

            </div>


            <!-- XR -->

            <div class="guaranteeCard">

                <div class="guaranteeTitle">
                    XR GUARANTEE
                </div>

                <div
                    id="xrCounter"
                    class="guaranteeCounter"
                >
                    0 / 15000
                </div>

                <div class="guaranteeBar">

                    <div
                        id="xrBar"
                        class="guaranteeBarFill"
                    ></div>

                </div>

            </div>


        </div>



        <!-- =========================
             RESULT
        ========================== -->

        <div id="resultArea">

            <div id="resultLabel">
                RESULT
            </div>

            <div id="resultRarity">
                ---
            </div>

        </div>



        <!-- =========================
             HISTORY
        ========================== -->

        <div id="historyArea">

            <h2>
                HISTORY
            </h2>

            <div id="historyList"></div>

        </div>


    </main>



    <!-- =========================
         SSR OVERLAY
    ========================== -->

    <div
        id="ssrOverlay"
        class="overlay"
    >

        <div class="overlayContent">

            <div class="rareText">
                SUPER RARE
            </div>

            <div class="rareRarity">
                SSR
            </div>

            <button id="ssrContinue">
                CONTINUE
            </button>

        </div>

    </div>



    <!-- =========================
         XR OVERLAY
    ========================== -->

    <div
        id="xrOverlay"
        class="overlay xr"
    >

        <div class="overlayContent">

            <div class="rareText">
                EXTREME RARE
            </div>

            <div class="rareRarity">
                XR
            </div>

            <button id="xrContinue">
                CONTINUE
            </button>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>


</body>

</html>
