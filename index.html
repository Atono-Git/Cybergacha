<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CYBER GACHA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =================================
         HEADER
    ================================== -->

    <header>

        <div class="systemStatus">
            <span class="statusDot"></span>
            SYSTEM ONLINE
        </div>

        <h1>
            # CYBER GACHA
        </h1>

    </header>


    <!-- =================================
         MAIN
    ================================== -->

    <main>

        <div class="instruction">
            TAP THE BOX TO OPEN
        </div>


        <!-- =================================
             GACHA AREA
        ================================== -->

        <section id="gachaArea">

            <!-- パーティクル -->
            <div id="particleContainer"></div>

            <!-- クリスタル -->
            <div id="crystalContainer"></div>

            <!-- ビーム -->
            <div id="beamContainer"></div>

            <!-- 衝撃波 -->
            <div id="shockwaveContainer"></div>


            <!-- =================================
                 GACHA BOX
            ================================== -->

            <div id="gachaBox">

                <div class="boxTop">

                    <div class="boxLight"></div>

                </div>


                <div class="boxBody">

                    <div class="boxLine line1"></div>
                    <div class="boxLine line2"></div>
                    <div class="boxLine line3"></div>


                    <div class="boxScreen">

                        <span id="boxScreenSmall">
                            CYBER
                        </span>

                        <strong id="boxScreenMain">
                            GACHA
                        </strong>

                    </div>


                    <div class="boxCore"></div>

                </div>


                <div class="boxBottom"></div>

            </div>


            <!-- =================================
                 HUD RINGS
            ================================== -->

            <div class="scanner scanner1"></div>
            <div class="scanner scanner2"></div>

            <div class="hudRing hudRing1"></div>
            <div class="hudRing hudRing2"></div>
            <div class="hudRing hudRing3"></div>


            <!-- =================================
                 CHARGE MESSAGE
            ================================== -->

            <div id="chargeMessage">
                GACHA
            </div>


            <!-- =================================
                 TAP TEXT
            ================================== -->

            <div id="tapText">
                TAP BOX
            </div>

        </section>


        <!-- =================================
             RESULT
        ================================== -->

        <section id="resultArea">

            <div id="resultLabel">
                RESULT
            </div>

            <div id="resultRarity">
                ---
            </div>

        </section>


        <!-- =================================
             GUARANTEE
        ================================== -->

        <section id="guaranteeArea">

            <div class="guaranteeCard">

                <div class="guaranteeTitle">
                    SSR GUARANTEE
                </div>

                <div id="ssrCounter" class="guaranteeCounter">
                    0 / 200
                </div>

                <div class="guaranteeBar">
                    <div id="ssrBar" class="guaranteeBarFill"></div>
                </div>

            </div>


            <div class="guaranteeCard">

                <div class="guaranteeTitle">
                    XR GUARANTEE
                </div>

                <div id="xrCounter" class="guaranteeCounter">
                    0 / 15000
                </div>

                <div class="guaranteeBar">
                    <div id="xrBar" class="guaranteeBarFill"></div>
                </div>

            </div>

        </section>


        <!-- =================================
             SETTINGS
        ================================== -->

        <section id="settings">

            <button id="ldmButton">
                LDM: OFF
            </button>

            <button id="skipButton">
                SKIP: OFF
            </button>

            <button id="resetButton">
                RESET DATA
            </button>

        </section>


        <!-- =================================
             HISTORY
        ================================== -->

        <section id="historyArea">

            <h2>
                HISTORY
            </h2>

            <div id="historyList"></div>

        </section>

    </main>


    <!-- =================================
         SSR OVERLAY
    ================================== -->

    <div id="ssrOverlay" class="overlay">

        <div class="overlayContent">

            <div class="rareText">
                SUPER RARE
            </div>

            <div class="rareRarity">
                SSR
            </div>

            <button id="ssrContinue">
                CONTINUE
            </button>

        </div>

    </div>


    <!-- =================================
         XR OVERLAY
    ================================== -->

    <div id="xrOverlay" class="overlay xr">

        <div class="overlayContent">

            <div class="rareText">
                EXTREME RARE
            </div>

            <div class="rareRarity">
                XR
            </div>

            <button id="xrContinue">
                CONTINUE
            </button>

        </div>

    </div>


    <!-- =================================
         SCRIPT
    ================================== -->

    <script src="script.js"></script>

</body>
</html>
